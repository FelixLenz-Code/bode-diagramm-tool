name: Build Releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Linux AppImage ────────────────────────────────────────────────────────────
  appimage:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-tk libfuse2

      - name: Python-Abhängigkeiten installieren
        run: pip install matplotlib numpy pillow pyinstaller

      - name: PyInstaller-Bundle bauen
        run: |
          python -m PyInstaller \
            --name "BodeDiagrammTool" \
            --onedir \
            --windowed \
            --noconfirm \
            --add-data "icons:icons" \
            --hidden-import "PIL._tkinter_finder" \
            bode_tool.py

      - name: appimagetool herunterladen
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: AppDir zusammenstellen
        run: |
          APPDIR=BodeDiagrammTool.AppDir
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -r dist/BodeDiagrammTool/*   "$APPDIR/usr/bin/"
          cp icons/icon.png               "$APPDIR/bode-diagramm-tool.png"
          cp icons/icon.png               "$APPDIR/usr/share/icons/hicolor/256x256/apps/bode-diagramm-tool.png"
          cp .github/appimage/AppRun      "$APPDIR/AppRun"
          chmod +x                        "$APPDIR/AppRun"
          cp .github/appimage/bode-diagramm-tool.desktop "$APPDIR/bode-diagramm-tool.desktop"
          cp .github/appimage/bode-diagramm-tool.desktop "$APPDIR/usr/share/applications/"

      - name: AppImage bauen
        run: |
          ARCH=x86_64 ./appimagetool \
            BodeDiagrammTool.AppDir \
            BodeDiagrammTool-x86_64.AppImage

      - name: AppImage zum Release hochladen
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            BodeDiagrammTool-x86_64.AppImage --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: AppImage als Build-Artefakt speichern
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: BodeDiagrammTool-AppImage
          path: BodeDiagrammTool-x86_64.AppImage

  # ── macOS DMG ─────────────────────────────────────────────────────────────────
  macos-dmg:
    runs-on: macos-13   # x86_64 – läuft nativ auf Intel und per Rosetta auf Apple Silicon

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten installieren
        run: pip install matplotlib numpy pillow pyinstaller

      - name: App-Icon erstellen (.icns)
        run: |
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size icons/icon.png --out icon.iconset/icon_${size}x${size}.png
          done
          sips -z 1024 1024 icons/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icons/icon.icns

      - name: .app-Bundle bauen
        run: |
          python -m PyInstaller \
            --name "BodeDiagrammTool" \
            --onedir \
            --windowed \
            --noconfirm \
            --add-data "icons:icons" \
            --hidden-import "PIL._tkinter_finder" \
            --icon "icons/icon.icns" \
            bode_tool.py

      - name: DMG erstellen
        run: |
          hdiutil create \
            -volname "BodeDiagrammTool" \
            -srcfolder "dist/BodeDiagrammTool.app" \
            -ov -format UDZO \
            "BodeDiagrammTool-macOS.dmg"

      - name: DMG zum Release hochladen
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            BodeDiagrammTool-macOS.dmg --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: DMG als Build-Artefakt speichern
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: BodeDiagrammTool-macOS
          path: BodeDiagrammTool-macOS.dmg

  # ── Windows EXE ───────────────────────────────────────────────────────────────
  windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten installieren
        run: pip install matplotlib numpy pillow pyinstaller

      - name: EXE bauen
        run: |
          python -m PyInstaller `
            --name "BodeDiagrammTool" `
            --onefile `
            --windowed `
            --noconfirm `
            --add-data "icons;icons" `
            --hidden-import "PIL._tkinter_finder" `
            --icon "icons/icon.ico" `
            bode_tool.py

      - name: EXE zum Release hochladen
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            dist/BodeDiagrammTool.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: EXE als Build-Artefakt speichern
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: BodeDiagrammTool-Windows
          path: dist/BodeDiagrammTool.exe
